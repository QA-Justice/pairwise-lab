<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pairwise Lab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css?v=20260705-font-table-height" />
  </head>
  <body>
    <div class="shell">
      <header class="masthead">
        <div>
          <p class="eyebrow">NO SERVER / FREE TO USE ✦ - Tia</p>
          <h1>PAIRWISE LAB</h1>
        </div>
        <div class="masthead__meta">
          <span id="statusChip" class="status-chip">READY</span>
          <span id="strengthLabel" class="mono">2-WISE</span>
        </div>
      </header>

      <main class="workspace">
        <section class="panel panel--input" aria-labelledby="input-title">
          <div class="panel__head">
            <h2 id="input-title">INPUT BLOCK</h2>
            <button id="sampleButton" class="button button--secondary" type="button">
              LOAD SAMPLE
            </button>
          </div>

          <label class="field">
            <span>FACTORS</span>
            <textarea
              id="factorInput"
              spellcheck="false"
              rows="12"
              placeholder="Browser=Chrome, Edge, Safari&#10;OS=Windows, macOS, iOS&#10;Login Type=Email, Google, Kakao"
            ></textarea>
          </label>

          <label class="field">
            <span>INVALID COMBINATIONS</span>
            <textarea
              id="constraintInput"
              spellcheck="false"
              rows="5"
              placeholder="OS=iOS && Browser=Edge&#10;Plan=Free && Feature=Advanced"
            ></textarea>
          </label>

          <div class="control-row" aria-label="generation options">
            <label class="radio-line">
              <input type="radio" name="strength" value="2" checked />
              <span>2-WISE</span>
            </label>
            <label class="radio-line">
              <input type="radio" name="strength" value="3" />
              <span>3-WISE</span>
            </label>
          </div>

          <div class="field-group" aria-label="max cases options">
            <span class="field-group__label">MAX CASES</span>
            <div class="case-limit-row">
              <label class="radio-line radio-line--compact">
                <input type="radio" name="maxCases" value="" checked />
                <span>ALL</span>
              </label>
              <label class="radio-line radio-line--compact">
                <input type="radio" name="maxCases" value="10" />
                <span>10</span>
              </label>
              <label class="radio-line radio-line--compact">
                <input type="radio" name="maxCases" value="25" />
                <span>25</span>
              </label>
              <label class="radio-line radio-line--compact">
                <input type="radio" name="maxCases" value="50" />
                <span>50</span>
              </label>
              <label class="radio-line radio-line--compact">
                <input type="radio" name="maxCases" value="100" />
                <span>100</span>
              </label>
            </div>
          </div>

          <div class="button-row">
            <button id="generateButton" class="button button--primary" type="button">
              GENERATE
            </button>
            <button id="resetButton" class="button button--ghost" type="button">
              RESET
            </button>
          </div>

          <div id="messageBlock" class="message-block" role="status" aria-live="polite">
            <span class="mono">NO RUN YET</span>
          </div>
        </section>

        <section class="panel panel--results" aria-labelledby="result-title">
          <div class="panel__head panel__head--results">
            <div>
              <p class="eyebrow">OUTPUT</p>
              <h2 id="result-title">TEST CASES</h2>
            </div>
            <button id="csvButton" class="button button--secondary" type="button" disabled>
              EXPORT CSV
            </button>
          </div>

          <div class="stats-grid">
            <div class="stat-box">
              <span>CASES</span>
              <strong id="caseCount">0</strong>
            </div>
            <div class="stat-box">
              <span id="tupleLabel">VALID PAIRS</span>
              <strong id="pairCount">0</strong>
            </div>
            <div class="stat-box">
              <span>COVERAGE</span>
              <strong id="coverageCount">0%</strong>
            </div>
          </div>

          <div id="tableWrap" class="table-wrap">
            <div class="empty-state">
              <span>WAITING FOR INPUT</span>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script src="./pairwise-core.js?v=20260705-equals-only"></script>
    <script src="./app.js?v=20260705-equals-only"></script>
  </body>
</html>
